services:
  # 1. Main Database
  postgres:
    image: postgres:15-alpine
    container_name: voucher-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - voucher-network

  # 2. In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: voucher-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - voucher-network

  # 3. Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: voucher-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - voucher-network

  voucher-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voucher-spring-boot
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - voucher-network

  k6-test:
    image: grafana/k6:latest
    container_name: k6-loadtest
    networks:
      - voucher-network
    volumes:
      - ./load-test.js:/scripts/load-test.js
    environment:
      - BASE_URL=http://voucher-app:8080
    command: run /scripts/load-test.js
    profiles:
      - test
    depends_on:
      - voucher-app

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  voucher-network:
    driver: bridge