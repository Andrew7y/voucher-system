spring:
  application:
    name: voucher-system

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10

  rabbitmq:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USER}
    password: ${MQ_PASSWORD}
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        prefetch: 20
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-retries: 3

app:
  env: ${APP_ENV}

alert:
  slack:
    enabled: true
    webhook-url: ${SLACK_WEBHOOK_URL}
    throttle-interval-ms: 60000

server:
  port: 8080

management:
  tracing:
    sampling:
      probabilty: 1.0
    enabled: true

logging:
  level:
    com.example.vouchersystem: ${LOG_LEVEL}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{traceId},%X{spanId}] - %msg%n"
